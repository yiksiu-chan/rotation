# Override config for the spatial-easy (table-across) task.
# Only fields that differ from default.yaml are listed here.
#
# Run behavior with:
#   python src/behavior/run_behavior.py \
#     --config config/default.yaml \
#     --config_override config/spatial_easy.yaml

task_setup:
  task: spatial_easy
  dataset: spatial-easy

# models:
# meta-llama/Llama-3.3-70B-Instruct
# allenai/Olmo-3-7B-Instruct
# allenai/Olmo-3-32B-Think
# google/gemma-3-4b-it
# google/gemma-3-12b-it
# Qwen/Qwen3-4B-Instruct-2507
# Qwen/Qwen3-30B-A3B-Instruct-2507


behavior:
  balanced_set_size_behavior: 100

pca_plots:
  save_PCA_plots: true
  save_top_n_tokens_4_PCAplots: 1

variants:
  # 20-variant in total
  start_variant: 0
  end_variant: 19

batching:
  batch_size_generation: 64
  batch_size_cache: 64

tokens:
  max_new_tokens: 60