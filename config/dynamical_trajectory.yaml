# Configuration for src/run_dynamical_trajectory_analysis.py.
#
# Trains multinomial logistic-regression predictors of the three microscopic
# classes (honest_success, lie_success, lie_fail) from kinematic descriptors
# (velocity, curvature, ...) of per-sample layer trajectories.
#
# Self-contained: not merged into ExperimentConfig. The entry point reads
# this file directly. CLI flags (e.g. --data_folder) override the matching
# top-level keys here.

# ------------------------------------------------------------------- #
# I/O                                                                 #
# ------------------------------------------------------------------- #
# Paths are absolute, or relative to PROJECT_ROOT.
io:
  # Where serialized models, fold metrics, and column manifests are written.
  results_dir: /oscar/data/superlab/projects/Rotation/results/dynamical_trajectory #results/dynamical_trajectory
  # Where figures are written. #TODO be able to use {model_alias} in the path
  plots_dir: /oscar/data/superlab/projects/Rotation/results/plots/Llama-3.1-8B-Instruct/dynamical_trajectory #results/plots/dynamical_trajectory
  # Output formats for every figure.
  plot_formats: [png]

# ------------------------------------------------------------------- #
# Data source                                                         #
# ------------------------------------------------------------------- #
data:
  # Single cache-stage seed folder (the one containing activations/).
  # Required: pass --data_folder on the CLI or set it here.
  data_folder: null
  # Token-position labels to slice on (one analysis run per label).
  # Empty list = use the top-1 position from
  # ``<data_folder>/stage_stats/rotation_stats.json`` ranked by
  # ``rotation_metric`` below.
  token_positions: []
  # Rotation metric used to pick the top-1 token position when
  # ``token_positions`` is empty.
  rotation_metric: largest_drop_any_early_to_late
  # Inclusive layer range to use (-1 on either side = no bound).
  layer_start: 10
  layer_end: 20
  # Per-class cap (after pooling GT_0 + GT_1). -1 = use all.
  n_samples_per_class: -1
  # RNG seed for any subsampling.
  data_seed: 0

# ------------------------------------------------------------------- #
# Held-out test evaluation                                            #
# ------------------------------------------------------------------- #
# For each entry in ``test.data_folders``, apply the trained pipeline
# (preprocessing scaler + supervised DiM directions + logistic regression)
# saved per training token position to that test cache, and emit only the
# plots toggled on in ``test.plots``. Each test folder gets its own
# subfolder under ``<plots_dir>/<run_alias>/<train_token_position>/test/``.
test:
  # List of cache seed folders to evaluate the trained pipeline on. Empty
  # list = no test evaluation. CLI: --data_folder_test path1 path2 ...
  data_folders: []
  # Rotation metric used to pick the top-1 token position on each test
  # folder. Null = inherit ``data.rotation_metric``.
  rotation_metric: null
  # How to pick the test-time token position:
  #   - ``test_top1``: use the test cache's own top-1 (transfer setting;
  #     warns when it differs from training).
  #   - ``match_train``: force the training position label on test
  #     (strict held-out; semantics may misalign across datasets).
  #   - ``explicit``: use ``test.token_position_explicit`` verbatim.
  token_position_policy: test_top1
  token_position_explicit: null
  # Distribution-shift handling at test time. Each mode in the list runs
  # and writes to its own subfolder
  # (``std-frozen__dir-frozen/`` etc.); a cross-mode bar chart is also
  # written when more than one combination runs.
  #
  # standardization_modes:
  #   - ``frozen``: apply the training-time scaler verbatim.
  #   - ``refit_on_test``: refit a fresh scaler (same class) on the test
  #     predictor matrix and apply that. The LR coefficients themselves
  #     stay frozen. Recovers from pure scale shift.
  # direction_modes (only meaningful for predictors using supervised DiMs):
  #   - ``frozen``: project onto the training-time DiMs.
  #   - ``refit_on_test``: refit the DiMs on the test cache's full slab
  #     and project onto those. Recovers from pure axis shift.
  standardization_modes: [frozen, refit_on_test]
  direction_modes: [frozen, refit_on_test]
  # Emit per-layer cosine similarity between training-fit and test-refit
  # DiM directions, plus a curve plot per supervised descriptor. Free
  # diagnostic for whether the axis itself is task-invariant.
  report_direction_cosine: true
  # Toggle which figures get written under each test subfolder. Booleans.
  plots:
    descriptor_curves: true
    pca: true
    confusion_matrix: true
    accuracy: true
    direction_cosines: true

# ------------------------------------------------------------------- #
# Descriptor pipeline                                                 #
# ------------------------------------------------------------------- #
descriptors:
  # Ordered list of descriptor names to compute. Each name must be a key in
  # ``DESCRIPTOR_REGISTRY`` in src/analysis/dynamical_trajectory.py. Add
  # ``kwargs`` per descriptor to pass extra arguments to its function.

  individual:
    velocity:                   { function: velocity }
    acceleration:               { function: acceleration }
    jerk:                       { function: jerk }
    directional_curvature:      { function: directional_curvature }
    kinematic_curvature:        { function: kinematic_curvature }
    vector_angular_curvature:   { function: vector_angular_curvature } # degree, first layer is blank, n-1 values
    angle_curvature_cum:        { function: angle_curvature_cum } # per-layer cumulative sum of angular curvature
    angular_curvature_sum:      { function: angular_curvature_sum } # global sum, broadcast across layers
    arc_length:                 { function: arc_length }
    arc_length_cum:             { function: arc_length_cum }   # per-layer cumulative

    # Supervised projection descriptors. Each one fits a per-layer DiM
    # direction from training labels (refit per CV fold inside run_cv) and
    # projects the activations / their updates onto it. 
    proj_2_lie-honest_direction:         { function: proj_2_lie-honest_direction }
    proj_2_lie-honest_direction_updates: { function: proj_2_lie-honest_direction_updates }
    proj_2_lie-honest_direction_cum:     { function: proj_2_lie-honest_direction_cum }
    proj_2_lie-honest_direction_sum:     { function: proj_2_lie-honest_direction_sum }
    proj_2_lie_success-fail_direction:         { function: proj_2_lie_success-fail_direction }
    proj_2_lie_success-fail_direction_updates: { function: proj_2_lie_success-fail_direction_updates }
    proj_2_lie_success-fail_direction_cum:     { function: proj_2_lie_success-fail_direction_cum }
    proj_2_lie_success-fail_direction_sum:     { function: proj_2_lie_success-fail_direction_sum }
    proj_2_truthful_direction:           { function: proj_2_truthful_direction }
    proj_2_truthful_direction_updates:   { function: proj_2_truthful_direction_updates }
    proj_2_truthful_direction_cum:       { function: proj_2_truthful_direction_cum }
    proj_2_truthful_direction_sum:       { function: proj_2_truthful_direction_sum }

# ------------------------------------------------------------------- #
# Preprocessing                                                       #
# ------------------------------------------------------------------- #
preprocessing:
  # Gaussian 1D smoothing across the layer axis (independent per descriptor).
  smoothing:
    enabled: false
    sigma: 1.0
  # Per-descriptor scaling (fit on training fold only inside the CV loop,
  # and on the full data for the coefficient heatmap).
  standardization:
    enabled: true
    scaler: standard  # 'standard' | 'robust' | 'none'

# ------------------------------------------------------------------- #
# Predictor (multinomial logistic regression)                         #
# ------------------------------------------------------------------- #
predictor:
  # 'l1' -> feature selection (saga). 'l2' -> stable (lbfgs/saga).
  # 'elasticnet' -> mix (saga).
  penalty: l2
  C: 1.0
  l1_ratio: 0.5      # used only when penalty='elasticnet'
  max_iter: 5000
  solver: null       # null = auto-pick from penalty
  random_state: 0
  class_weight: balanced  # 'balanced' or null

# ------------------------------------------------------------------- #
# Cross-validation                                                    #
# ------------------------------------------------------------------- #
cv:
  method: kfold      # 'kfold' or 'shuffle_split'
  n_splits: 5
  test_size: 0.2     # used only for shuffle_split
  shuffle: true
  stratified: true
  random_state: 0

# ------------------------------------------------------------------- #
# Class subsets to predict                                            #
# ------------------------------------------------------------------- #
# Each entry defines a class-subset run. The logistic regression is fit
# only on rows whose class is in the listed set; supervised
# (mean-difference) descriptors still fit their direction on the full
# 3-class population so e.g. proj_2_lie-honest_direction is computed
# even when honest_success is not in the prediction target.
#
# Per-subset outputs land under
# ``<results_dir>/<alias>/<token_position>/<classes-joined-by-+>/`` (and
# the matching subfolder under plots_dir). When this block is empty the
# script falls back to a single implicit "all" subset covering every
# microscopic class.
#
# ``--class_subsets <name>...`` on the CLI restricts which named subsets
# run for this invocation.
class_subsets:
  #all:        [honest_success, lie_success, lie_fail]
  lie_only:   [honest_success,lie_success, lie_fail]
  # honest_vs_lie_success: [honest_success, lie_success]

# ------------------------------------------------------------------- #
# Combined predictors                                                 #
# ------------------------------------------------------------------- #
# Each key is the name of a combined model whose features concatenate the
# columns produced by every listed individual descriptor. Names must match
# keys under ``descriptors.individual`` above.
combined_predictors:
  kinematic_all:
    descriptors: [velocity, acceleration, jerk, kinematic_curvature]
  directional_all: 
    descriptors: [velocity, acceleration, jerk, directional_curvature]
  angular_all:
    descriptors: [velocity, acceleration, jerk, vector_angular_curvature]
  cumulatives:
    descriptors: [angle_curvature_cum, arc_length_cum]
  proj_all:
    descriptors:
      - proj_2_lie-honest_direction
      - proj_2_truthful_direction
      - proj_2_lie_success-fail_direction
     
  # truthful_proj_all:
  #   descriptors:
  #     - proj_2_truthful_direction
  #     - proj_2_truthful_direction_updates
  #     - proj_2_truthful_direction_cum
  #     - proj_2_truthful_direction_sum

# ------------------------------------------------------------------- #
# Visualization                                                       #
# ------------------------------------------------------------------- #
plots:
  # PCA dimensions to render per predictor. Each entry produces one figure
  # (2 -> 2D scatter; 3 -> 3D scatter).
  pca_dims: [2, 3]
  # Band shown around mean-descriptor curves: 'stddev' or 'ci95'.
  mean_curve_band: ci95
  # Diverging colormap for coefficient heatmaps.
  coef_cmap: RdBu_r
  # Per-class colors for line / scatter overlays.
  class_colors:
    honest_success: "orange"
    lie_success:    "blue"
    lie_fail:       "purple"
